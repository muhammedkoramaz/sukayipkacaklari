# LeakExpert — Netlify yapılandırması
[build]
  publish = "."

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 404.html Netlify tarafından otomatik kullanılır.
# İletişim formu: form etiketinde data-netlify="true" ve hidden "form-name" alanı hazır.
