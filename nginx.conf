# LeakExpert — sukayipkacaklari.com static nginx (Coolify)

# apex + www + anything -> canonical non-www (301)
server {
    listen 80;
    listen [::]:80;
    server_name www.sukayipkacaklari.com;
    return 301 https://sukayipkacaklari.com$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Powered-By "LeakExpert" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/rss+xml image/svg+xml application/manifest+json font/ttf font/otf application/vnd.ms-fontobject;

    # hashed / immutable static assets — long cache
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location = /favicon.ico { add_header Cache-Control "public, max-age=31536000, immutable" always; }
    location ~* \.(webp|png|jpe?g|gif|svg|woff2?|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # xml / txt — short cache
    location ~* \.(xml|txt)$ {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # html — pretty URLs, revalidate
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
